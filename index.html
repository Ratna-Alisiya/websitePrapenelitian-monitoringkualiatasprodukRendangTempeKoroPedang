<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Packaging Rendang</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f6f8fa;
      text-align: center;
      padding: 2rem;
    }

    .container {
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: inline-block;
    }

    #quality, #price {
      margin-top: 20px;
      font-size: 1.2rem;
      font-weight: bold;
    }

    #generator {
      margin-top: 3rem;
      text-align: center;
    }

    input {
      padding: 0.5rem;
      margin: 0.3rem;
      width: 80px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Scan QR Label Indikator</h1>
    <div id="reader" style="width:300px"></div>
    <div id="quality"></div>
    <div id="price"></div>

    <div id="generator">
      <h2>Generate QR dari Nilai RGB</h2>
      <input type="number" id="r" placeholder="R (0-255)" min="0" max="255">
      <input type="number" id="g" placeholder="G (0-255)" min="0" max="255">
      <input type="number" id="b" placeholder="B (0-255)" min="0" max="255">
      <button onclick="generateQR()">Buat QR</button>
      <canvas id="qrCanvas"></canvas>
    </div>
  </div>

  <script>
    function interpretColor(rgb) {
      if (rgb.r > 180 && rgb.g < 100 && rgb.b < 100) {
        return "Baik";
      } else if (rgb.r > 180 && rgb.g > 150 && rgb.b < 50) {
        return "Menurun";
      } else {
        return "Buruk";
      }
    }

    function getPriceByQuality(quality) {
      switch(quality) {
        case "Baik": return "Rp 25.000";
        case "Menurun": return "Rp 18.000";
        case "Buruk": return "Rp 10.000";
      }
    }

    function updateDisplay(rgb) {
      const quality = interpretColor(rgb);
      const price = getPriceByQuality(quality);
      document.getElementById("quality").innerText = `Kualitas: ${quality}`;
      document.getElementById("price").innerText = `Harga: ${price}`;
    }

    function extractRGBFromQR(text) {
      try {
        const rgb = JSON.parse(text);
        if (rgb.r !== undefined && rgb.g !== undefined && rgb.b !== undefined) {
          updateDisplay(rgb);
        }
      } catch (e) {
        document.getElementById("quality").innerText = "Format QR tidak sesuai.";
      }
    }

    const html5QrCode = new Html5Qrcode("reader");
    Html5Qrcode.getCameras().then(devices => {
      if (devices && devices.length) {
        html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: 250 },
          (decodedText) => {
            html5QrCode.stop();
            extractRGBFromQR(decodedText);
          }
        );
      }
    }).catch(err => {
      document.getElementById("quality").innerText = `Error: ${err}`;
    });

    function generateQR() {
      const r = parseInt(document.getElementById("r").value);
      const g = parseInt(document.getElementById("g").value);
      const b = parseInt(document.getElementById("b").value);

      if (isNaN(r) || isNaN(g) || isNaN(b)) {
        alert("Harap masukkan nilai RGB yang valid (0-255)");
        return;
      }

      const qr = new QRious({
        element: document.getElementById("qrCanvas"),
        size: 200,
        value: JSON.stringify({ r, g, b })
      });
    }
  </script>
</body>
</html>
